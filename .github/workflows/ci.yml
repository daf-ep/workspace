name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trivial: ${{ steps.diff.outputs.trivial }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Say whether every changed file is documentation
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu

          case "$BASE" in
            "" | 0000000000000000000000000000000000000000)
              echo "trivial=false" >> "$GITHUB_OUTPUT"
              echo "nothing to diff against, so this counts as not trivial"
              exit 0
              ;;
          esac

          changed=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$changed"

          if echo "$changed" | grep -vqE '\.md$'; then
            echo "trivial=false" >> "$GITHUB_OUTPUT"
          else
            echo "trivial=true" >> "$GITHUB_OUTPUT"
            echo "only markdown changed, skipping the header check and the Dart suite"
          fi

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/commits/check.sh "$BASE" "$HEAD"

  headers:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check license headers
        run: bash .github/headers/check.sh

  verify:
    needs: changes
    if: needs.changes.outputs.trivial != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('cli/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve, analyse, check the formatting and run the suite
        run: bash cli/tool/test.sh
